<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | VibeWrite</title>
    <link rel="stylesheet" href="./login.css">
    <style>
        body {
            background-color: #0b0d12;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .error-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 3rem;
            max-width: 500px;
            background: rgba(18, 22, 31, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7000ff, #ff5e00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        .error-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
            color: #f8fafc;
        }
        .error-desc {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .btn-home {
            display: inline-block;
            background: linear-gradient(135deg, #7000ff, #ff5e00);
            border: none;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }
        .btn-home:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>

<div class="error-wrapper">
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>
    <div class="dark-overlay"></div>

    <div class="error-card">
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <p class="error-desc">Oops! Lagta hai aap kisi aisay raste par aa gaye hain jo mojood nahi hai ya remove kar diya gaya hai.</p>
        <a href="./index.html" class="btn-home">Back to Home</a>
    </div>
</div>

</body>
</html>
